<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineralDB · 礦物化學成分資料庫</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="gem">◆</span>
    <div>
      <h1>MineralDB</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <input id="search" type="search" data-i18n-ph="search_ph" autocomplete="off">
      <button id="clearSearch" class="icon-btn" title="清空" hidden>✕</button>
    </div>
    <button id="btnAdd" class="btn primary" data-i18n="btn_add">＋ 添加礦物</button>
    <button id="btnBatch" class="btn" data-i18n="btn_batch"></button>
    <button id="btnExport" class="btn" data-i18n="btn_export" data-i18n-title="btn_export_title"></button>
    <button id="btnImport" class="btn" data-i18n="btn_import" data-i18n-title="btn_import_title"></button>
    <select id="langSel" class="lang-sel" title="Language">
      <option value="zh-Hant">繁體中文</option>
      <option value="zh-Hans">简体中文</option>
      <option value="en">English</option>
    </select>
    <input id="fileImport" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<div id="catBar" class="cat-bar"></div>

<main>
  <div id="stats" class="stats"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <p data-i18n="no_results"></p>
    <p class="hint" data-i18n="no_results_hint"></p>
  </div>
</main>

<footer>
  <p data-i18n="footer_disclaimer"></p>
  <p data-i18n="footer_local"></p>
</footer>

<!-- 詳情彈窗 -->
<div id="modalDetail" class="modal" hidden>
  <div class="modal-card">
    <button class="modal-close icon-btn" data-close>✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- 添加/編輯表單彈窗 -->
<div id="modalForm" class="modal" hidden>
  <div class="modal-card wide">
    <button class="modal-close icon-btn" data-close>✕</button>
    <h2 id="formTitle"></h2>
    <form id="mineralForm">
      <div class="form-grid">
        <label><span data-i18n="f_en"></span> *<input name="en" required data-i18n-ph="f_en_ph"></label>
        <label><span data-i18n="f_zh"></span><input name="zh" data-i18n-ph="f_zh_ph"></label>
        <label><span data-i18n="f_aliases"></span><input name="aliases" data-i18n-ph="f_aliases_ph"></label>
        <label><span data-i18n="f_formula"></span> *<input name="formula" required data-i18n-ph="f_formula_ph"></label>
        <label><span data-i18n="f_category"></span>
          <select name="category" id="catSelect"></select>
        </label>
        <label><span data-i18n="f_src"></span><input name="src" data-i18n-ph="f_src_ph"></label>
      </div>

      <fieldset>
        <legend data-i18n="majors_legend"></legend>
        <div id="majorRows" class="rows"></div>
        <button type="button" class="btn small" data-addrow="major" data-i18n="btn_addrow"></button>
      </fieldset>

      <fieldset>
        <legend data-i18n="traces_legend"></legend>
        <div id="traceRows" class="rows"></div>
        <button type="button" class="btn small" data-addrow="trace" data-i18n="btn_addrow"></button>
      </fieldset>

      <label class="full"><span data-i18n="f_note"></span><textarea name="note" rows="2" data-i18n-ph="f_note_ph"></textarea></label>

      <div class="form-actions">
        <button type="submit" class="btn primary" data-i18n="btn_save"></button>
        <button type="button" class="btn" data-close data-i18n="btn_cancel"></button>
      </div>
    </form>
  </div>
</div>

<!-- 批量導入彈窗 -->
<div id="modalBatch" class="modal" hidden>
  <div class="modal-card wide">
    <button class="modal-close icon-btn" data-close>✕</button>
    <h2 data-i18n="batch_title"></h2>
    <p class="note" data-i18n-html="batch_desc"></p>
    <table class="data" id="batchHelpTable"></table>
    <div class="batch-actions">
      <button class="btn" id="btnTemplate" data-i18n="batch_tpl"></button>
      <label class="btn primary file-label"><span data-i18n="batch_choose"></span><input id="fileBatch" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden></label>
      <label class="note inline"><input type="checkbox" id="skipDup" checked> <span data-i18n="batch_skipdup"></span></label>
    </div>
    <div id="batchResult" class="batch-result" hidden></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="./i18n.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
